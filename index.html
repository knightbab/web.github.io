<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>剪贴板事件监听</title>
  <style>
    body {
      padding: 20px;
      font-family: system-ui;
    }
    input {
      padding: 8px 12px;
      width: 300px;
      margin-bottom: 20px;
    }
    #log {
      white-space: pre-wrap;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 6px;
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <input type="text" placeholder="在这里输入、复制、剪切、粘贴">
  <div id="log"></div>

  <script>
    const log = document.getElementById('log');

    // 打印日志辅助函数
    function appendLog(text) {
      log.textContent = text + '\n\n' + log.textContent;
    }

    // 监听 copy 事件
    document.addEventListener('copy', (e) => {
      appendLog('===== copy 事件 =====');
      appendLog('事件对象：' + JSON.stringify(e, null, 2));
      appendLog('clipboardData：' + JSON.stringify(e.clipboardData, null, 2));
    });

    // 监听 cut 事件
    document.addEventListener('cut', (e) => {
      appendLog('===== cut 事件 =====');
      appendLog('事件对象：' + JSON.stringify(e, null, 2));
      appendLog('clipboardData：' + JSON.stringify(e.clipboardData, null, 2));
    });

    // 监听 paste 事件
    document.addEventListener('paste', (e) => {
      appendLog('===== paste 事件 =====');
      appendLog('事件对象：' + JSON.stringify(e, null, 2));
      appendLog('clipboardData：' + JSON.stringify(e.clipboardData, null, 2));
    });
  </script>
</body>
</html>
